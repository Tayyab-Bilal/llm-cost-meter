name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples
      - name: Billing guard over src/ and tests/
        run: python -m llm_cost_meter.guards.ast_guard src/ tests/test_*.py tests/conftest.py
      - run: pytest -q
